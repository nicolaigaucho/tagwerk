name: Foto-Erkennung einrichten
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/functions.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PROJECT_REF: pamaardrurbevhayxbvc
    steps:
      - name: Secrets prüfen
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Secret SUPABASE_ACCESS_TOKEN fehlt"; exit 1; }
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "::error::Secret ANTHROPIC_API_KEY fehlt"; exit 1; }
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: API-Schlüssel bei Supabase hinterlegen
        run: supabase secrets set --yes --project-ref "$PROJECT_REF" ANTHROPIC_API_KEY="$(printf %s "$ANTHROPIC_API_KEY" | tr -d '[:space:]')"
      - name: Funktion veröffentlichen
        run: supabase functions deploy food-photo --yes --project-ref "$PROJECT_REF" --use-api
